<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the saved theme before first paint (default: dark; "auto" follows the system).
      (function () {
        try {
          var m = localStorage.getItem("youki-theme") || "dark";
          var r = m === "auto" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : m;
          document.documentElement.dataset.theme = r;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta name="description" content="妖気メダルの解析とNFCコマンド生成を行うWebアプリ。NFC通信はNFC Toolsに委譲します。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>妖気チャージ Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
